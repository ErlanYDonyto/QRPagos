<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Validación y Pago del Sistema">
    <meta property="og:description" content="Escanea este código QR para realizar el depósito bancario y proceder con el desarrollo.">
    <meta property="og:image" content="qr.jpg">
    <meta property="og:type" content="website">
    
    <title>Pasarela de Pago QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 text-center">
        <div class="card p-4 shadow-sm" style="max-width: 400px; border-radius: 15px;">
            <h3 class="text-dark mb-3">Código QR de Pago</h3>
            <p class="text-muted small">Realiza la transferencia por el monto acordado para iniciar con los módulos del software.</p>
            <img src="QRPago.jpeg" alt="Código QR Bancario" class="img-fluid my-3 rounded">
            <div class="alert alert-info small m-0" role="alert">
                Una vez realizado el pago, el sistema notificará el inicio del proyecto.
            </div>
        </div>
    </div>

</body>
</html>
